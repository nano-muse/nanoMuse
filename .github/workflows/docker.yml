name: Docker image

# Publishes ghcr.io/nano-muse/nanomuse for linux/amd64 and linux/arm64:
#   main            -> :edge
#   tag vX.Y.Z      -> :X.Y.Z, :X.Y, :latest
#   tag vX.Y.Z-rc1  -> :X.Y.Z-rc1 only (a pre-release moves neither :X.Y nor :latest)
# Pull requests build the amd64 image without pushing (the CI workflow smoke-tests it).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: build and push
    runs-on: ubuntu-latest
    # two multi-arch images, the arm64 half under QEMU: about ten minutes, rarely twenty
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/nanomuse
          # lower-case is required by GHCR; the owner is nano-muse
          flavor: latest=false
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
          # what the image holds, in pyproject.toml's words (the hands are not in it)
          labels: |
            org.opencontainers.image.title=nanoMuse
            org.opencontainers.image.description=nanoMuse, an open-source personal agent for every device you own: the runtime in a container, with the agent, the Sentinel that decides what may run, and the web app. Bring your own model.
            org.opencontainers.image.licenses=GPL-3.0-or-later

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The same image with Chromium bundled and the browser tool on: :edge-browser,
      # :X.Y.Z-browser, :latest-browser. amd64 only: Chromium and its libraries under QEMU
      # take far too long to build; on an arm64 box, `docker build --build-arg WITH_BROWSER=1 .`
      # does the same natively.
      - name: Image tags (browser)
        id: meta_browser
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/nanomuse
          flavor: |
            latest=false
            suffix=-browser
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=nanoMuse (with browser)
            org.opencontainers.image.description=nanoMuse with Chromium bundled for the browser tool.
            org.opencontainers.image.licenses=GPL-3.0-or-later

      - name: Build and push (browser)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: WITH_BROWSER=1
          push: true
          tags: ${{ steps.meta_browser.outputs.tags }}
          labels: ${{ steps.meta_browser.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
