name: Showcase images

# Publishes the two images the hosted demo runs (demo/showcase/docker-compose.yml):
#   ghcr.io/nano-muse/showcase-caddy     Caddy + Cloudflare modules + the built phone (MobileGym
#                                        with the nanoMuse app)
#   ghcr.io/nano-muse/showcase-gateway   the session gateway
# main -> :latest and :sha-<short>. The server then does `docker compose pull && up -d`.
# Pull requests that touch the showcase build both without pushing.

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - ".github/workflows/showcase.yml"
  pull_request:
    paths:
      - "demo/**"
      - ".github/workflows/showcase.yml"
  workflow_dispatch:

# Only the publish job pushes to GHCR; the tests get a read-only token.
permissions:
  contents: read

concurrency:
  group: showcase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-tests:
    name: gateway tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e './demo/showcase/gateway[dev]'
      # the gateway, the mirror's scripts and the tests: the same lint the runtime gets
      - run: ruff check demo && ruff format --check demo
      # the type check the runtime gets too (gateway/pyproject.toml lists the files)
      - run: cd demo/showcase/gateway && mypy
      - run: pytest -q demo/showcase/gateway/tests

  publish:
    name: build and push
    needs: gateway-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags (caddy)
        id: meta_caddy
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/showcase-caddy
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=nanoMuse showcase: Caddy and the phone
            org.opencontainers.image.licenses=GPL-3.0-or-later

      - name: Build and push (caddy)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: demo/showcase/caddy/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_caddy.outputs.tags }}
          labels: ${{ steps.meta_caddy.outputs.labels }}
          cache-from: type=gha,scope=showcase-caddy
          cache-to: type=gha,mode=max,scope=showcase-caddy

      - name: Tags (gateway)
        id: meta_gateway
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/showcase-gateway
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=nanoMuse showcase: session gateway
            org.opencontainers.image.licenses=GPL-3.0-or-later

      - name: Build and push (gateway)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: demo/showcase/gateway
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_gateway.outputs.tags }}
          labels: ${{ steps.meta_gateway.outputs.labels }}
          cache-from: type=gha,scope=showcase-gateway
          cache-to: type=gha,mode=max,scope=showcase-gateway
