name: iOS · build check

# Compiles the iOS app on a Mac runner without signing and without Apple credentials: the way
# to find out whether android/src/ios still builds (the tree is written on Linux) before
# spending an App Store Connect upload on it. Runs on every pull request that touches the iOS
# tree, and by hand from the Actions tab for anything else (a dependency script under
# android/deps/, say). The native dependencies take the better part of an hour the first time;
# the cache is shared with ios-testflight.yml, so a green check makes the next TestFlight run
# cheap. No secrets: CODE_SIGNING_ALLOWED=NO, so a fork's pull request can run it too.

on:
  pull_request:
    paths:
      - 'android/src/ios/**'
      - '.github/workflows/ios-check.yml'
  workflow_dispatch:

concurrency:
  group: ios-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: xcodebuild (unsigned)
    runs-on: macos-26
    timeout-minutes: 150
    env:
      GO_VERSION: "1.25"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: android/deps/rclone-mobile/go.sum

      - name: Homebrew packages (iSH kernel and rootfs tooling)
        run: brew install ninja meson llvm lld libarchive pkg-config

      - name: Build-time configuration
        working-directory: android/src/ios
        run: cp Configs/ProviderCustomization.xcconfig.example Configs/ProviderCustomization.xcconfig

      - name: Pinned iSH revision
        id: ish
        run: echo "rev=$(git rev-parse HEAD:android/deps/ish)" >> "$GITHUB_OUTPUT"

      - name: Native dependency cache
        id: deps-cache
        uses: actions/cache@v6
        with:
          path: |
            android/deps/libs
            android/deps/include
            android/deps/resources
            android/deps/frameworks
            android/deps/lame-build
          key: ios-deps-${{ runner.os }}-${{ steps.ish.outputs.rev }}-${{ hashFiles('android/deps/*.sh', 'android/deps/ffmpeg-patch/**', 'android/deps/rclone-mobile/**') }}

      - name: Native dependencies (LAME → FFmpeg → iSH → Alpine rootfs → rclone)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        working-directory: android
        run: |
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
          ./deps/build_rclone_ios.sh

      - name: Build for a device, unsigned
        working-directory: android/src/ios
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project Minis.xcodeproj -scheme Minis -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= \
            -skipPackagePluginValidation -skipMacroValidation \
            2>&1 | tee build/xcodebuild.log | grep -E "error:|/NanoMuse/.*warning:|BUILD|Compiling|Linking" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build/xcodebuild.log

      # docs/ios.md: the device build must finish with zero warnings in NanoMuse/. Upstream's
      # files are theirs; ours are held to the bar here, so a warning cannot sit on main unnoticed.
      - name: Zero warnings in NanoMuse/
        working-directory: android/src/ios
        run: |
          if grep -E "/NanoMuse/[^:]+:[0-9]+:[0-9]+: warning:" build/xcodebuild.log | sort -u | tee build/nanomuse-warnings.txt | grep -q .; then
            echo "::error::warnings in NanoMuse/ (see above)"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-check-log-${{ github.run_number }}
          path: android/src/ios/build/xcodebuild.log
          retention-days: 7
          if-no-files-found: warn
