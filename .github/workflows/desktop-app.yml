# nanoMuse Desktop — the desktop built on DeepSeek Harness (harness/desktop, Electron), with
# dsh and the nanoMuse bundle staged inside and the runtime for the hands bundled:
#
#   Windows  nanoMuse-Desktop-<v>-win-x64.exe        (NSIS installer)
#   macOS    nanoMuse-Desktop-<v>-mac-arm64.dmg / -x64.dmg  (+ .zip)
#   Linux    nanoMuse-Desktop-<v>-linux-x64.AppImage / .deb / .tar.gz
#
# Each platform builds the bundle (harness/dsh-nanomuse: pnpm build, test, pack), stages dsh
# next to it with npm (scripts/prepare-dsh.mjs — the platform's own native prebuilds), builds
# the runtime (scripts/desktop-app/build-runtime.py --target harness/desktop/runtime, a
# PyInstaller build), wraps it all with electron-builder, and
# then boots the unpacked app's harness once in Node mode (scripts/smoke.mjs) to see the Host
# come up with the bundle's rows. On macOS the Swift helper that holds the hands' permissions
# (harness/desktop/mac/computer-use/build.sh → "nanoMuse Computer Use.app") is built first and
# electron-builder lays out the .app with it inside;
# scripts/desktop-app/package-mac.sh ad-hoc signs it (or signs and notarizes with the Apple
# secrets; docs/desktop.md says how they are made) and writes the zip and an APFS dmg.
# No Windows certificate: Windows asks for "Run anyway"; without the Apple secrets the macOS
# bundle is ad-hoc signed and macOS asks for Open Anyway in System Settings → Privacy & Security.
# A push that touches harness/desktop builds Linux only; "Run workflow" and the release tags
# `v*` build all four, and a tag uploads the installers to the release of the same name — the
# one scripts/release-apk.sh creates with the APK — retrying until it exists. "Run workflow"
# with a release tag does the same for a release that already exists (a platform fixed afterwards).
name: desktop app

on:
  push:
    branches: ["**"]
    paths: ["harness/**", "scripts/desktop-app/**", ".github/workflows/desktop-app.yml"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the installers to this existing release (v0.1.30, say); empty builds only"
        required: false
        default: ""

# Only the release job writes (gh release upload); the build jobs get a read-only token.
permissions:
  contents: read

# One run per branch; a newer push to the same branch cancels the older build,
# but a tag or a manual run is never cancelled.
concurrency:
  group: desktop-app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  plan:
    name: which platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        env:
          FULL: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          LINUX='{"os":"ubuntu-22.04","label":"linux-x64"}'
          ALL="[{\"os\":\"windows-latest\",\"label\":\"windows-x64\"},{\"os\":\"macos-latest\",\"label\":\"macos-arm64\"},{\"os\":\"macos-15-intel\",\"label\":\"macos-x64\"},$LINUX]"
          if [ "$FULL" = "true" ]; then echo "matrix=$ALL" >> "$GITHUB_OUTPUT"; else echo "matrix=[$LINUX]" >> "$GITHUB_OUTPUT"; fi

  build:
    name: ${{ matrix.label }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: harness/desktop/package-lock.json
      # setup-node caches one package manager; the bundle's pnpm store is kept by hand
      - name: pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('harness/dsh-nanomuse/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Linux packages the runtime and the installers need
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xdotool libfuse2 rpm
      - name: The bundle
        working-directory: harness/dsh-nanomuse
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm typecheck
          pnpm test
          VERSION=$(node -p "require('./package.json').version")
          SHELL_VERSION=$(node -p "require('../desktop/package.json').version")
          if [ "$VERSION" != "$SHELL_VERSION" ]; then
            echo "harness/dsh-nanomuse is $VERSION, harness/desktop is $SHELL_VERSION — the release recipe bumps both" >&2
            exit 1
          fi
      - name: The harness, staged
        working-directory: harness/desktop
        shell: bash
        run: node scripts/prepare-dsh.mjs
      - name: The runtime for the hands
        if: runner.os != 'Linux'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # cryptography 49 stopped shipping Intel Mac wheels; the source build links Homebrew's
          # OpenSSL, which PyInstaller then mixes up with Python's own. The last universal2
          # wheel carries its OpenSSL inside.
          if [ "${{ matrix.label }}" = "macos-x64" ]; then python -m pip install "cryptography<49"; fi
          python -m pip install -e ".[hands]" pyinstaller
          python scripts/desktop-app/build-runtime.py --check --target harness/desktop/runtime
      - name: The runtime for the hands (Linux — inside Debian 11, so it runs on glibc 2.31 and newer)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e HOME=/tmp/home python:3.12-bullseye bash -euo pipefail -c '
            python -m pip install --upgrade pip
            python -m pip install -e ".[hands]" pyinstaller
            python scripts/desktop-app/build-runtime.py --check --target harness/desktop/runtime
            chown -R '"$(id -u):$(id -g)"' harness/desktop/runtime build *.egg-info 2>/dev/null || true
          '
          ls harness/desktop/runtime | head
      - name: The app
        if: runner.os != 'macOS'
        working-directory: harness/desktop
        shell: bash
        run: |
          npm ci
          npm run typecheck
          npm run dist
      - name: The helper that holds the hands' permissions (macOS — nanoMuse Computer Use.app, Swift)
        if: runner.os == 'macOS'
        shell: bash
        # a universal bundle (arm64 + x86_64) under harness/desktop/mac/computer-use/build/,
        # which electron-builder.yml copies into nanoMuse.app/Contents/Helpers
        run: harness/desktop/mac/computer-use/build.sh
      - name: The app (macOS — signed and notarized with the Apple secrets, ad-hoc without; zip and APFS dmg by hand)
        if: runner.os == 'macOS'
        working-directory: harness/desktop
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          APP_DIR: harness/desktop
          APP_NAME: nanoMuse
          ARTIFACT: nanoMuse-Desktop
        run: |
          npm ci
          npm run typecheck
          npm run dist:dir
          ../../scripts/desktop-app/package-mac.sh "${{ matrix.label == 'macos-arm64' && 'arm64' || 'x64' }}"
      - name: Boot the packaged harness once
        working-directory: harness/desktop
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS) node scripts/smoke.mjs --app "$(ls -d dist/mac*/ | head -1)" ;;
            Windows) node scripts/smoke.mjs --app dist/win-unpacked ;;
            *) node scripts/smoke.mjs --app dist/linux-unpacked ;;
          esac
      # The unpacked app is complete whatever the installer does; the installer is what
      # people get. electron-builder's NSIS target used to leave the face's clips out of it
      # (electron-builder.yml, nsis.preCompressedFileExtensions); the archive inside the
      # installer must list them.
      - name: The installer carries the face's clips (Windows)
        if: runner.os == 'Windows'
        working-directory: harness/desktop
        shell: bash
        run: |
          # 7-Zip is on the Windows runner's PATH; the app's archive sits in the installer as
          # $PLUGINSDIR/app-64.7z, and -r finds it by name (nsis-check/ is beside dist/, not in it,
          # so the artifact upload does not see it)
          7z e -y -r -onsis-check dist/*.exe app-64.7z > /dev/null
          7z l nsis-check/app-64.7z > nsis-check/list.txt
          for mood in idle working waiting happy; do
            grep -Eq "dsh-nanomuse[/\\\\]assets[/\\\\]dragon-$mood\.mp4" nsis-check/list.txt || { echo "the installer's archive lacks dsh-nanomuse/assets/dragon-$mood.mp4" >&2; exit 1; }
          done
          echo "the installer's archive carries the four clips"
      - name: What was built
        shell: bash
        working-directory: harness/desktop
        run: ls -la dist | grep -Ev "^total|builder-|\.blockmap|\.yml$" || true
      - uses: actions/upload-artifact@v7
        with:
          name: nanomuse-desktop-${{ matrix.label }}
          path: |
            harness/desktop/dist/*.AppImage
            harness/desktop/dist/*.deb
            harness/desktop/dist/*.tar.gz
            harness/desktop/dist/*.exe
            harness/desktop/dist/*.dmg
            harness/desktop/dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # the release is created by scripts/release-apk.sh right after it pushes the tag;
          # give it up to fifteen minutes
          for i in $(seq 1 90); do
            if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then break; fi
            sleep 10
          done
          gh release view "$TAG" -R "$REPO" >/dev/null
          (cd packages && sha256sum * > SHA256SUMS-desktop.txt && cat SHA256SUMS-desktop.txt)
          gh release upload "$TAG" packages/* -R "$REPO" --clobber
