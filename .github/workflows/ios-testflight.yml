name: iOS · TestFlight

# Archive the iOS app and hand it to TestFlight (internal testers; no App Review involved).
# Manual, or on an `ios-*` tag. Needs six repository secrets, see docs/ios.md:
#   APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_P8, APPLE_TEAM_ID
#   IOS_DIST_P12_BASE64, IOS_DIST_P12_PASSWORD
# Signing is manual: the team's Apple Distribution certificate from the secrets, the App Store
# profiles fetched from the account with the key. Nothing that signs is in the repository.

on:
  workflow_dispatch:
  push:
    tags: ["ios-*"]

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    name: archive · upload
    runs-on: macos-26
    timeout-minutes: 150
    env:
      GO_VERSION: "1.25"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # android/deps/ish (the ARM64 iSH fork)

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: android/deps/rclone-mobile/go.sum

      - name: Homebrew packages (iSH kernel and rootfs tooling)
        run: brew install ninja meson llvm lld libarchive pkg-config

      - name: Build-time configuration
        working-directory: android/src/ios
        run: cp Configs/ProviderCustomization.xcconfig.example Configs/ProviderCustomization.xcconfig

      # The native dependencies take the better part of an hour from source and change only
      # when their scripts or the iSH gitlink do, so they are cached on exactly that.
      - name: Pinned iSH revision
        id: ish
        run: echo "rev=$(git rev-parse HEAD:android/deps/ish)" >> "$GITHUB_OUTPUT"

      - name: Native dependency cache
        id: deps-cache
        uses: actions/cache@v6
        with:
          path: |
            android/deps/libs
            android/deps/include
            android/deps/resources
            android/deps/frameworks
            android/deps/lame-build
          key: ios-deps-${{ runner.os }}-${{ steps.ish.outputs.rev }}-${{ hashFiles('android/deps/*.sh', 'android/deps/ffmpeg-patch/**', 'android/deps/rclone-mobile/**') }}

      - name: Native dependencies (LAME → FFmpeg → iSH → Alpine rootfs → rclone)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        working-directory: android
        run: |
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
          ./deps/build_rclone_ios.sh

      - name: Archive and upload to TestFlight
        working-directory: android/src/ios
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: fastlane beta

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nanoMuse-ios-${{ github.run_number }}
          path: |
            android/src/ios/build/*.ipa
            android/src/ios/build/*.dSYM.zip
          retention-days: 14
          if-no-files-found: warn
