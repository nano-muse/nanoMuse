# Agent preset "nanoMuse": the persona of a personal agent on top of the same
# capability set as DeepSeek Harness' shipped `standard` preset (tools, skills,
# goals, plan mode, compaction, delegation). The Web app composes a session
# from exactly one preset, and a complete preset persona suppresses the global
# `system-prompt` persona, so the voice has to live here.
#
# The plugin list below mirrors `@deepseek-ai/dsh-web-app/presets/standard.patch.yml`
# of the pinned dsh version; when dsh moves, diff against it. Only the `persona`
# row differs. Our own capabilities (Hands, Reach, the Sentinel gate) will be
# added to this list as plugins, which is the point of the exercise.
- insert:
    - id: preset-nanomuse
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: nanomuse
        name: nanoMuse
        description: A personal agent on your own devices. Same tools as Standard, nanoMuse's voice.
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are nanoMuse, an open-source personal agent that lives on this
                person's own devices, built on DeepSeek Harness and currently
                answering through the {{model}} model. You speak plainly and
                briefly, in the language the person writes in, and you say what
                you did rather than what you are about to do. You never pretend a
                step succeeded. When something needs the person's hand — a
                password, a payment, a code — you say so and wait.
              suffix: Your working directory is {{cwd}}.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true

          # ── nanoMuse's own ────────────────────────────────────────────────
          # Hands: this computer's screen and mouse/keyboard, from the runtime's
          # `nanomuse mcp` (nanomuse/bridge/mcp_server.py) over stdio — the tools
          # arrive as mcp__nanomuse__computer_screen / computer_act, with the
          # runtime's descriptions and its "ask the person first" gate. NANOMUSE_PY
          # names the runtime's executable when it is not on PATH (a venv, the
          # desktop app's bundled runtime); a missing runtime leaves the preset
          # without hands rather than broken.
          - id: nanomuse-hands
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              transport: stdio
              serverName: nanomuse
              command: !!js process.env.NANOMUSE_PY || 'nanomuse'
              args: [mcp]
              # DISPLAY for the hands on Linux; NANOMUSE_MCP_CONFIRM binds the
              # server's "the person agreed" confirmations to this host (the
              # desktop shell sets it per launch; see nanomuse/bridge/mcp_server.py).
              env: !!js |
                Object.fromEntries(['DISPLAY', 'NANOMUSE_MCP_CONFIRM'].filter((k) => process.env[k]).map((k) => [k, process.env[k]]))
              cwd: !!js process.env.HOME || process.env.USERPROFILE || process.cwd()
              toolCallTimeoutMs: 120000
              failOnStartupError: false
          # Reach: the account's other devices over the hub — `devices`,
          # `device_screen`, `device_shell`, `device_files`, `device_open`,
          # `device_notify` and `delegate` (src/reach.ts), plus the prompt
          # context that tells the agent its name and who is around. Needs the
          # cloud row (`nanomuse-cloud`) and a signed-in account to do anything;
          # without one the tools answer that it is not signed in.
          - id: nanomuse-reach
            name: dsh-nanomuse/reach
          # The rooms from inside a chat: `goal_update`, `feed_post`,
          # `library_add` (src/rooms-tools.ts) and the prompt context listing
          # the person's goals. Needs the `nanomuse-rooms` row of the bundle.
          - id: nanomuse-rooms-tools
            name: dsh-nanomuse/rooms-tools
          # The services connected on Settings → Connectors: one MCP client per
          # connection (src/connectors-tools.ts), through the host row
          # `nanomuse-connectors`' loopback proxy, which holds the credentials.
          - id: nanomuse-connectors-tools
            name: dsh-nanomuse/connectors-tools
