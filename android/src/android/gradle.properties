org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# nanoMuse: the app's Compose graph needs more than Kotlin's default heap on CI runners.
kotlin.daemon.jvmargs=-Xmx3072m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# nanoMuse: Compose and lifecycle libraries ship lint checks compiled against a newer Kotlin
# analysis API. The bundled lint crashes in those detectors; the dependency set requires 8.13.2.
android.experimental.lint.version=8.13.2
